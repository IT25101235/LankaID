<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"><body>
<div th:fragment="fields" class="grid sm:grid-cols-2 gap-4 mt-6">
  <h3 class="sm:col-span-2 font-bold">Payment details</h3>
  <label class="sm:col-span-2 text-sm font-semibold">Cardholder name<input name="cardholderName" th:value="${cardForm.cardholderName}" required maxlength="150" pattern="[\p{L}][\p{L}\p{M} ]*" title="Use letters and spaces only" autocomplete="off" class="block w-full mt-2 rounded-xl border-slate-300"/><span th:if="${cardErrors != null}" th:text="${cardErrors['cardholderName']}" class="block text-red-700 text-xs mt-1"></span></label>
  <label class="sm:col-span-2 text-sm font-semibold">Card number<input name="cardNumber" th:value="${cardForm.cardNumber}" required maxlength="19" pattern="[0-9]{4}( [0-9]{4}){3}" inputmode="numeric" title="Enter 16 digits" autocomplete="off" placeholder="4111 1111 1111 1111" class="block w-full mt-2 rounded-xl border-slate-300 font-mono"/><span th:if="${cardErrors != null}" th:text="${cardErrors['cardNumber']}" class="block text-red-700 text-xs mt-1"></span></label>
  <label class="text-sm font-semibold">Expiry<input name="expiry" th:value="${cardForm.expiry}" required maxlength="5" pattern="(0[1-9]|1[0-2])/[0-9]{2}" inputmode="numeric" autocomplete="off" placeholder="MM/YY" class="block w-full mt-2 rounded-xl border-slate-300"/><span th:if="${cardErrors != null}" th:text="${cardErrors['expiry']}" class="block text-red-700 text-xs mt-1"></span></label>
  <label class="text-sm font-semibold">CVV<input name="cvv" th:value="${cardForm.cvv}" required maxlength="3" pattern="[0-9]{3}" inputmode="numeric" type="password" autocomplete="off" placeholder="123" class="block w-full mt-2 rounded-xl border-slate-300"/><span th:if="${cardErrors != null}" th:text="${cardErrors['cvv']}" class="block text-red-700 text-xs mt-1"></span></label>
</div>
</body></html>
