<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>Upload Documents | LankaID</title><script src="https://cdn.tailwindcss.com?plugins=forms"></script><link href="/css/citizen-theme.css" rel="stylesheet"/></head>
<body class="min-h-screen bg-slate-100 text-slate-800">
<header class="bg-white border-b"><div class="max-w-4xl mx-auto px-4 h-16 flex items-center justify-between"><a th:href="@{/citizen/dashboard}" class="font-extrabold text-lg">Lanka<span class="text-sky-600">ID</span></a><span class="text-sm font-semibold">Document Upload</span></div></header>
<main class="max-w-4xl mx-auto p-4 py-7">
  <h1 class="text-2xl font-bold">Upload supporting documents</h1><p class="text-sm text-slate-500 mt-1">Application <span class="font-mono font-semibold" th:text="${currentApplication.applicationNo}">LK-NIC-2026-123456</span></p>
  <div th:if="${documentMessage}" class="mt-4 bg-emerald-50 border border-emerald-200 text-emerald-700 rounded-xl p-4 text-sm font-semibold" th:text="${documentMessage}"></div>
  <div th:if="${documentError}" class="mt-4 bg-red-50 border border-red-200 text-red-700 rounded-xl p-4 text-sm font-semibold" th:text="${documentError}"></div>
  <section class="bg-white border rounded-2xl p-5 mt-5 shadow-sm"><h2 class="font-bold">Required for this application</h2><div class="flex flex-wrap gap-2 mt-3"><span th:each="type : ${requiredTypes}" class="bg-sky-50 border border-sky-200 text-sky-700 rounded-full px-3 py-1 text-xs font-bold" th:text="${#strings.replace(type, '_', ' ')}">PHOTOGRAPH</span></div></section>
  <form th:action="@{/citizen/{workflow}/{service}/documents(workflow=${workflowPath},service=${servicePath},applicationId=${currentApplication.applicationId})}" method="post" enctype="multipart/form-data" class="bg-white border rounded-2xl p-5 mt-5 shadow-sm">
    <h2 class="font-bold">Add a document</h2>
    <div class="grid sm:grid-cols-2 gap-4 mt-4">
      <label class="text-sm font-semibold">Document type<select name="documentType" required class="mt-1 w-full rounded-lg border-slate-300 bg-white"><option value="">Select</option><option value="PHOTOGRAPH">Photograph</option><option value="BIRTH_CERTIFICATE">Birth certificate</option><option value="NIC_PROOF">NIC proof</option><option value="POLICE_REPORT">Police report</option><option value="CITIZENSHIP_CERTIFICATE">Citizenship certificate</option><option value="OTHER">Other</option></select></label>
      <label class="text-sm font-semibold">PDF, JPG or PNG — maximum 5 MB<input name="file" type="file" accept=".pdf,.jpg,.jpeg,.png" required class="mt-1 w-full rounded-lg border border-slate-300 p-2"/></label>
    </div><button type="submit" class="mt-4 bg-sky-600 text-white rounded-xl px-5 py-2.5 text-sm font-bold">Upload document</button>
  </form>
  <section class="bg-white border rounded-2xl p-5 mt-5 shadow-sm">
    <h2 class="font-bold">Uploaded documents</h2><p th:if="${#lists.isEmpty(documents)}" class="text-sm text-slate-500 mt-3">No documents uploaded yet.</p>
    <div th:each="document : ${documents}" class="mt-3 border rounded-xl p-3 flex items-center justify-between gap-3"><div class="min-w-0"><p class="text-sm font-bold" th:text="${#strings.replace(document.documentType, '_', ' ')}">PHOTOGRAPH</p><p class="text-xs text-slate-500 font-mono mt-1 truncate" th:text="${document.filePath}">application-documents/path.pdf</p></div><span class="text-xs bg-amber-50 text-amber-700 rounded-full px-3 py-1 font-bold" th:text="${document.verificationStatus}">PENDING</span></div>
  </section>
  <div class="flex justify-between mt-6 gap-3"><a th:href="@{/citizen/dashboard}" class="border bg-white rounded-xl px-5 py-2.5 text-sm font-semibold">Save and return later</a><a th:href="@{/citizen/{workflow}/{service}/review(workflow=${workflowPath},service=${servicePath},applicationId=${currentApplication.applicationId})}" class="bg-sky-600 text-white rounded-xl px-5 py-2.5 text-sm font-bold">Review application</a></div>
</main></body></html>
