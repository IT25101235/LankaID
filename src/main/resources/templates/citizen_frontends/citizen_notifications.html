<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Notifications | LankaID</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
  <link href="/css/citizen-theme.css" rel="stylesheet"/>
  <style>body{font-family:'Public Sans',sans-serif;background:#f1f5f9}</style>
</head>
<body class="min-h-screen text-slate-800">
<header class="bg-white border-b shadow-sm"><div class="max-w-3xl mx-auto h-16 px-4 flex items-center justify-between"><a th:href="@{/citizen/dashboard}" class="text-sm font-semibold text-slate-600 flex items-center gap-1"><span class="material-symbols-outlined text-lg">arrow_back</span>Dashboard</a><span class="font-extrabold text-lg">Lanka<span class="text-sky-600">ID</span></span><form th:action="@{/citizen/notifications/read-all}" method="post"><button class="text-xs font-bold text-sky-700">Mark all read</button></form></div></header>
<main class="max-w-3xl mx-auto px-4 py-7">
  <div class="flex items-end justify-between"><div><h1 class="text-2xl font-extrabold">Notifications</h1><p class="text-sm text-slate-500 mt-1"><span th:text="${unreadCount}">0</span> unread</p></div><a th:href="@{/citizen/applications}" class="text-sm font-bold text-sky-700">My applications</a></div>

  <div th:if="${#lists.isEmpty(notifications)}" class="mt-6 bg-white border border-dashed rounded-2xl p-10 text-center"><span class="material-symbols-outlined text-5xl text-slate-300">notifications_none</span><p class="font-bold mt-2">No notifications yet</p><p class="text-sm text-slate-500 mt-1">Application, payment, appointment, and biometric updates will appear here.</p></div>

  <div th:unless="${#lists.isEmpty(notifications)}" class="mt-6 space-y-3">
    <article th:each="notification : ${notifications}" class="rounded-2xl border p-5 flex gap-4" th:classappend="${notification.read ? ' bg-white border-slate-200' : ' bg-sky-50 border-sky-200'}">
      <span class="w-11 h-11 rounded-xl flex items-center justify-center material-symbols-outlined" th:classappend="${notification.read ? ' bg-slate-100 text-slate-500' : ' bg-sky-100 text-sky-700'}" th:text="${#strings.contains(notification.notificationType, 'PAYMENT') ? 'payments' : (#strings.contains(notification.notificationType, 'APPOINTMENT') ? 'event' : (#strings.contains(notification.notificationType, 'BIOMETRIC') ? 'fingerprint' : 'description'))}">notifications</span>
      <div class="flex-1 min-w-0"><div class="flex flex-wrap justify-between gap-2"><p class="font-bold text-sm" th:text="${#strings.replace(notification.notificationType, '_', ' ')}">Update</p><time class="text-xs text-slate-400" th:text="${#temporals.format(notification.createdAt, 'dd MMM yyyy, HH:mm')}">Time</time></div><p class="text-sm text-slate-600 mt-2 leading-6" th:text="${notification.message}">Message</p><form th:unless="${notification.read}" th:action="@{/citizen/notifications/{id}/read(id=${notification.notificationId})}" method="post"><button class="text-xs text-sky-700 font-bold mt-3">Mark as read</button></form></div>
    </article>
  </div>
</main>
</body>
</html>
