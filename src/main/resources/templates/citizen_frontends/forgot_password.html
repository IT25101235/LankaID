<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="utf-8"/><link rel="icon" type="image/x-icon" href="/images/favicon.ico"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>Reset Password | LankaID</title><script src="https://cdn.tailwindcss.com?plugins=forms"></script><link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/><link href="/css/government-theme.css?v=20261007-ui" rel="stylesheet"/></head>
<body class="min-h-screen bg-slate-50 text-slate-900">
<header class="registration-header gov-site-header gov-official-strip border-b text-white"><div class="mx-auto flex h-[4.75rem] max-w-3xl items-center justify-between px-4"><div th:replace="~{fragments/government_brand :: brand(@{/}, 'dark')}"></div><a th:href="@{/login}" class="text-sm font-bold text-cyan-300">Back to sign in</a></div></header>
<main class="mx-auto max-w-xl px-4 py-10"><div class="mb-7"><p class="text-sm font-bold uppercase tracking-widest text-cyan-700">Citizen account</p><h1 class="mt-2 text-3xl font-extrabold">Reset your password</h1><p class="mt-2 text-slate-600">Verify your registered email, then choose a new password.</p></div>
  <div th:if="${successMessage}" class="mb-5 rounded-xl border border-emerald-200 bg-emerald-50 p-4 text-sm font-semibold text-emerald-800" th:text="${successMessage}"></div><div th:if="${errorMessage}" class="mb-5 rounded-xl border border-red-200 bg-red-50 p-4 text-sm font-semibold text-red-700" th:text="${errorMessage}"></div>
  <section class="rounded-2xl border bg-white p-6 shadow-sm"><div class="flex items-center gap-3"><span class="flex h-9 w-9 items-center justify-center rounded-full font-bold" th:classappend="${emailVerified} ? ' bg-emerald-100 text-emerald-700' : ' bg-cyan-100 text-cyan-800'" th:text="${emailVerified} ? '✓' : '1'">1</span><h2 class="font-bold">Verify registered email</h2><span th:if="${emailVerified}" class="ml-auto rounded-full bg-emerald-100 px-3 py-1 text-xs font-bold text-emerald-700">Verified</span></div>
    <form th:unless="${emailVerified}" th:action="@{/forgot-password/email/send}" method="post" class="mt-5 flex flex-col gap-3 sm:flex-row"><input name="email" type="email" th:value="${resetEmail}" required autocomplete="email" placeholder="you@example.com" class="min-w-0 flex-1 rounded-xl border-slate-300"/><button class="rounded-xl bg-cyan-700 px-5 py-3 text-sm font-bold text-white" th:text="${codeSent} ? 'Send new code' : 'Send code'">Send code</button></form>
    <div th:if="${codeSent and !emailVerified}" class="mt-4 rounded-xl bg-slate-50 p-4"><form th:action="@{/forgot-password/email/verify}" method="post" class="flex flex-col gap-3 sm:flex-row"><input name="code" required inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" placeholder="Six-digit code" class="min-w-0 flex-1 rounded-xl border-slate-300 text-center font-mono tracking-[0.3em]"/><button class="rounded-xl bg-slate-900 px-5 py-3 text-sm font-bold text-white">Verify email</button></form><form th:action="@{/forgot-password/email/resend}" method="post" class="mt-3"><button data-otp-retry data-ready-label="Resend code" th:attr="data-retry-seconds=${emailRetryAfterSeconds}" class="text-sm font-bold text-cyan-700 disabled:opacity-50">Resend code</button></form></div>
  </section>
  <section class="mt-5 rounded-2xl border bg-white p-6 shadow-sm" th:classappend="${!emailVerified} ? ' opacity-60'"><div class="flex items-center gap-3"><span class="flex h-9 w-9 items-center justify-center rounded-full bg-cyan-100 font-bold text-cyan-800">2</span><div><h2 class="font-bold">Choose new password</h2><p class="text-sm text-slate-500" th:text="${emailVerified} ? 'Email verified.' : 'Verify your email to enable these fields.'"></p></div></div>
    <form th:if="${emailVerified}" th:action="@{/forgot-password/reset}" th:object="${passwordReset}" method="post" class="mt-5 space-y-4"><div th:if="${#fields.hasGlobalErrors()}" class="rounded-xl bg-red-50 p-3 text-sm text-red-700"><p th:each="error : ${#fields.globalErrors()}" th:text="${error}"></p></div><div><label for="password" class="mb-1 block text-sm font-bold">New password</label><input id="password" type="password" th:field="*{password}" required minlength="8" maxlength="72" autocomplete="new-password" class="w-full rounded-xl border-slate-300"/><p th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="mt-1 text-xs text-red-600"></p></div><div><label for="confirmPassword" class="mb-1 block text-sm font-bold">Repeat new password</label><input id="confirmPassword" type="password" th:field="*{confirmPassword}" required maxlength="72" autocomplete="new-password" class="w-full rounded-xl border-slate-300"/><p th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}" class="mt-1 text-xs text-red-600"></p></div><p class="text-xs text-slate-500">Use 8–72 characters with uppercase, lowercase, a number and a symbol. No spaces.</p><button class="w-full rounded-xl bg-cyan-700 py-3 font-bold text-white">Reset password</button></form>
  </section>
</main><script src="/js/walkin-otp.js"></script><script src="/js/password-visibility.js?v=20261007-ui"></script></body></html>
