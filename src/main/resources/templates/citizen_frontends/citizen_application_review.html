<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>Review Application | LankaID</title><script src="https://cdn.tailwindcss.com?plugins=forms"></script><link href="/css/citizen-theme.css" rel="stylesheet"/></head>
<body class="min-h-screen bg-slate-100 text-slate-800">
<header class="bg-white border-b"><div class="max-w-4xl mx-auto px-4 h-16 flex items-center justify-between"><a th:href="@{/citizen/dashboard}" class="font-extrabold text-lg">Lanka<span class="text-sky-600">ID</span></a><span class="text-sm font-semibold">Final Review</span></div></header>
<main class="max-w-4xl mx-auto p-4 py-7">
  <h1 class="text-2xl font-bold">Review your application</h1><p class="text-sm text-slate-500 mt-1">Confirm the saved details and uploaded documents before submission.</p>
  <section class="bg-white border rounded-2xl p-5 mt-5 shadow-sm grid sm:grid-cols-2 gap-4 text-sm">
    <div><p class="text-xs text-slate-500">Application number</p><p class="font-bold font-mono mt-1" th:text="${currentApplication.applicationNo}"></p></div><div><p class="text-xs text-slate-500">Service</p><p class="font-bold mt-1" th:text="${currentApplication.serviceType}"></p></div><div><p class="text-xs text-slate-500">Application type</p><p class="font-bold mt-1" th:text="${currentApplication.applicationKind}"></p></div><div><p class="text-xs text-slate-500">Status</p><p class="font-bold mt-1 text-amber-700" th:text="${currentApplication.currentStatus}"></p></div>
    <div th:if="${nicApplication != null}"><p class="text-xs text-slate-500">Last NIC number</p><p class="font-bold mt-1" th:text="${nicApplication.lastNicNo != null ? nicApplication.lastNicNo : 'Not applicable'}"></p></div>
    <div th:if="${passportApplication != null}"><p class="text-xs text-slate-500">NIC proof</p><p class="font-bold mt-1" th:text="${passportApplication.nicProofNo != null ? passportApplication.nicProofNo : passportApplication.parentNicNo}"></p></div>
  </section>
  <section class="bg-white border rounded-2xl p-5 mt-5 shadow-sm"><h2 class="font-bold">Documents</h2><p th:if="${#lists.isEmpty(documents)}" class="text-sm text-slate-500 mt-3">No documents uploaded.</p><div th:each="document : ${documents}" class="border rounded-xl p-3 mt-3 flex justify-between gap-3 text-sm"><span class="font-semibold" th:text="${#strings.replace(document.documentType, '_', ' ')}"></span><span class="text-amber-700 font-bold text-xs" th:text="${document.verificationStatus}"></span></div></section>
  <div class="flex justify-between mt-6 gap-3"><a th:href="@{/citizen/{workflow}/{service}/documents(workflow=${workflowPath},service=${servicePath},applicationId=${currentApplication.applicationId})}" class="border bg-white rounded-xl px-5 py-2.5 text-sm font-semibold">Back to documents</a><form th:action="@{/citizen/{workflow}/{service}/submit(workflow=${workflowPath},service=${servicePath},applicationId=${currentApplication.applicationId})}" method="post"><button type="submit" class="bg-emerald-600 text-white rounded-xl px-6 py-2.5 text-sm font-bold" onclick="return confirm('Submit this application for officer review?')">Submit application</button></form></div>
</main></body></html>
