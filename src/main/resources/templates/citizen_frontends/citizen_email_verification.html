<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Verify Email | LankaID</title>
  <meta name="description" content="Verify your email address to complete LankaID citizen registration."/>
  <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
<link href="/css/government-theme.css?v=20260917" rel="stylesheet"/>
</head>
<body class="min-h-screen bg-slate-50 text-slate-900">
<header class="gov-site-header gov-official-strip border-b text-white">
  <div class="mx-auto flex h-[4.75rem] max-w-6xl items-center justify-between px-4 sm:px-6">
    <a th:href="@{/}" class="gov-brand" aria-label="LankaID, Government of Sri Lanka home">
      <img class="gov-emblem" src="/images/sri-lanka-government-emblem.png" alt="Sri Lanka Government emblem"/>
      <span><span class="gov-brand-title text-xl">Lanka<span>ID</span></span><span class="gov-brand-subtitle">Government of Sri Lanka</span></span>
    </a>
    <a th:href="@{/register}" class="text-sm font-semibold text-cyan-800 hover:underline">Start again</a>
  </div>
</header>

<main class="mx-auto flex min-h-[calc(100vh-4rem)] max-w-6xl items-center justify-center px-4 py-10 sm:px-6">
  <section class="w-full max-w-md rounded-2xl border border-slate-200 bg-white p-6 shadow-sm sm:p-8">
    <div class="mx-auto mb-5 flex h-14 w-14 items-center justify-center rounded-full bg-cyan-50 text-cyan-700">
      <span class="material-symbols-outlined text-3xl">mark_email_read</span>
    </div>
    <h1 class="text-center text-2xl font-bold">Verify your email</h1>
    <p class="mt-2 text-center text-sm leading-6 text-slate-500">Enter the six-digit code sent to <strong class="text-slate-700" th:text="${maskedEmail}">c***@example.com</strong>.</p>

    <p th:if="${successMessage}" th:text="${successMessage}" class="mt-5 rounded-lg border border-emerald-200 bg-emerald-50 px-4 py-3 text-sm text-emerald-700" role="status"></p>
    <p th:if="${errorMessage}" th:text="${errorMessage}" class="mt-5 rounded-lg border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700" role="alert"></p>

    <form id="verificationForm" th:action="@{/register/verify}" method="post" class="mt-6 space-y-5" novalidate>
      <div>
        <label for="code" class="mb-1.5 block text-sm font-semibold text-slate-700">Verification code</label>
        <input id="code" name="code" type="text" required inputmode="numeric" autocomplete="one-time-code" autofocus aria-describedby="codeClientError"
               pattern="[0-9]{6}" minlength="6" maxlength="6" placeholder="000000"
               class="w-full rounded-lg border border-slate-300 px-3 py-3 text-center font-mono text-2xl tracking-[0.45em] focus:border-cyan-700 focus:ring-cyan-700"/>
        <p id="codeClientError" class="mt-2 hidden text-xs text-red-600" role="alert"></p>
      </div>
      <button type="submit" class="flex h-12 w-full items-center justify-center rounded-lg bg-cyan-700 text-sm font-bold text-white transition hover:bg-cyan-800">Verify and create account</button>
    </form>

    <form th:action="@{/register/verify/resend}" method="post" class="mt-4 text-center">
      <button type="submit" class="text-sm font-semibold text-cyan-800 hover:underline">Resend verification code</button>
      <p th:if="${!canResend}" class="mt-1 text-xs text-slate-400">You can request another code after the cooldown.</p>
    </form>
  </section>
</main>
<script>
  const verificationForm = document.getElementById('verificationForm');
  const codeInput = document.getElementById('code');
  const codeError = document.getElementById('codeClientError');

  function validateCode() {
    const valid = /^\d{6}$/.test(codeInput.value);
    codeError.textContent = valid ? '' : 'Enter the complete six-digit verification code.';
    codeError.classList.toggle('hidden', valid);
    codeInput.classList.toggle('border-red-500', !valid);
    codeInput.setAttribute('aria-invalid', valid ? 'false' : 'true');
    return valid;
  }

  codeInput.addEventListener('input', () => {
    codeInput.value = codeInput.value.replace(/\D/g, '').slice(0, 6);
    if (codeInput.dataset.touched || codeInput.value.length === 6) validateCode();
  });
  codeInput.addEventListener('blur', () => {
    codeInput.dataset.touched = 'true';
    validateCode();
  });
  verificationForm.addEventListener('submit', event => {
    codeInput.dataset.touched = 'true';
    if (!validateCode()) {
      event.preventDefault();
      codeInput.focus();
    }
  });
</script>
</body>
</html>
