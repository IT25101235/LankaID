<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Walk-in Pass | LankaID</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700;800&amp;display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
  <link href="/css/citizen-theme.css" rel="stylesheet"/>
</head>
<body class="min-h-screen bg-slate-100 text-slate-800">
<header class="bg-white border-b">
  <div class="max-w-3xl mx-auto h-16 px-4 flex items-center">
    <a th:href="@{/}" class="font-extrabold">Lanka<span class="text-cyan-600">ID</span></a>
    <a th:href="@{/walk-in/recover}" class="ml-auto text-sm font-bold text-cyan-700">Recover another booking</a>
  </div>
</header>
<main class="max-w-3xl mx-auto p-4 sm:p-8">
  <div th:if="${walkInMessage}" class="mb-4 rounded-xl bg-emerald-50 border border-emerald-200 p-4 text-sm font-bold text-emerald-700" th:text="${walkInMessage}"></div>
  <div th:if="${walkInError}" class="rounded-xl bg-red-50 border border-red-200 p-6 text-center text-red-700" th:text="${walkInError}"></div>
  <section th:if="${walkIn != null}" class="bg-white rounded-3xl border shadow-sm overflow-hidden">
    <div class="bg-cyan-700 text-white p-6">
      <p class="text-xs uppercase tracking-wider font-bold text-cyan-100">Confirmed walk-in appointment</p>
      <h1 class="text-2xl font-extrabold mt-2">Appointment pass</h1>
    </div>
    <div class="p-6 sm:p-8 grid md:grid-cols-[280px_1fr] gap-7 items-start">
      <div class="text-center">
        <img class="w-full max-w-[280px] mx-auto border rounded-2xl" th:src="@{/walk-in/pass/{reference}/qr(reference=${walkIn.appointment.referenceNo})}" alt="Walk-in appointment QR code"/>
        <p class="font-mono font-extrabold text-cyan-700 mt-3 break-all" th:text="${walkIn.appointment.referenceNo}">WALK</p>
      </div>
      <div class="space-y-4 text-sm">
        <div><p class="text-xs text-slate-400">Visitor</p><p class="font-bold" th:text="${walkIn.appointment.visitorName}">Name</p></div>
        <div><p class="text-xs text-slate-400">Phone</p><p class="font-bold" th:text="${walkIn.appointment.visitorPhone}">Phone</p></div>
        <div><p class="text-xs text-slate-400">Service</p><p class="font-bold" th:text="${serviceLabel}">Service</p></div>
        <div><p class="text-xs text-slate-400">Centre</p><p class="font-bold" th:text="${walkIn.centreName}">Centre</p><p class="text-xs text-slate-500" th:text="${walkIn.centreAddress}">Address</p></div>
        <div><p class="text-xs text-slate-400">Date and time</p><p class="font-bold" th:text="${#temporals.format(walkIn.appointment.scheduledAt, 'dd MMM yyyy, hh:mm a')}">Date</p></div>
        <div><p class="text-xs text-slate-400">Status</p><p class="font-bold" th:text="${walkIn.appointment.appointmentStatus}">CONFIRMED</p></div>
        <div th:if="${walkInPayment != null}">
          <p class="text-xs text-slate-400">Payment received</p>
          <p class="font-bold text-emerald-700" th:text="${'LKR ' + #numbers.formatDecimal(walkInPayment.amount, 1, 'COMMA', 2, 'POINT')}">LKR 1,500.00</p>
          <p class="text-xs text-slate-500 break-all" th:text="${walkInPayment.transactionReference}">Payment reference</p>
        </div>
        <a th:href="@{/walk-in/pass/{reference}/download(reference=${walkIn.appointment.referenceNo})}" class="inline-flex items-center gap-2 rounded-xl bg-cyan-600 text-white px-5 py-3 font-bold"><span class="material-symbols-outlined">download</span>Download pass</a>
      </div>
    </div>
  </section>
</main>
<script src="/js/portal-shell.js?v=20260901-5"></script>
</body>
</html>
