<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>Recover Walk-in Booking | LankaID</title><script src="https://cdn.tailwindcss.com?plugins=forms"></script><link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700;800&amp;display=swap" rel="stylesheet"/><style>body{font-family:'Public Sans',sans-serif}</style></head>
<body class="min-h-screen bg-slate-100 text-slate-800"><header class="bg-white border-b"><div class="max-w-4xl mx-auto h-16 px-4 flex items-center"><a th:href="@{/}" class="font-extrabold">Lanka<span class="text-cyan-600">ID</span></a><a th:href="@{/walk-in}" class="ml-auto text-sm font-bold text-cyan-700">Book appointment</a></div></header><main class="max-w-4xl mx-auto p-4 sm:p-8"><h1 class="text-3xl font-extrabold">Recover walk-in booking</h1><p class="text-sm text-slate-500 mt-2">Enter the verified phone number used during booking.</p><form th:action="@{/walk-in/recover}" method="get" class="mt-5 bg-white border rounded-2xl p-4 flex flex-col sm:flex-row gap-3"><input name="phone" th:value="${phone}" required pattern="\+?[0-9 -]{10,16}" class="flex-1 rounded-xl border-slate-300" placeholder="0771234567"/><button class="rounded-xl bg-cyan-600 text-white px-5 py-3 font-bold">Find bookings</button></form><div th:if="${walkInError}" class="mt-4 rounded-xl bg-red-50 border border-red-200 p-4 text-sm font-bold text-red-700" th:text="${walkInError}"></div><div th:if="${walkIns != null and #lists.isEmpty(walkIns)}" class="mt-4 bg-white border border-dashed rounded-2xl p-8 text-center">No walk-in bookings were found for that phone number.</div><div th:if="${walkIns != null and !#lists.isEmpty(walkIns)}" class="mt-4 space-y-3"><article th:each="item : ${walkIns}" class="bg-white border rounded-2xl p-5 flex flex-col sm:flex-row sm:items-center gap-4"><div class="flex-1"><p class="font-bold" th:text="${item.appointment.visitorName}">Visitor</p><p class="font-mono text-xs text-cyan-700 mt-1" th:text="${item.appointment.referenceNo}">Reference</p><p class="text-sm text-slate-500 mt-2" th:text="${item.centreName + ' · ' + #temporals.format(item.appointment.scheduledAt, 'dd MMM yyyy, hh:mm a')}">Appointment</p></div><span class="rounded-full bg-slate-100 px-3 py-1 text-xs font-bold" th:text="${item.appointment.appointmentStatus}">Status</span><a th:href="@{/walk-in/pass/{reference}(reference=${item.appointment.referenceNo})}" class="rounded-xl bg-cyan-600 text-white px-4 py-2.5 text-sm text-center font-bold">Open QR pass</a></article></div></main></body></html>
