<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Citizen Support | LankaID</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
<link href="/css/government-theme.css?v=20260917" rel="stylesheet"/>
</head>
<body class="min-h-screen bg-slate-50 text-slate-800">
<header class="bg-white border-b">
  <div class="max-w-4xl mx-auto min-h-16 px-4 py-3 flex items-center gap-3">
    <a th:href="@{/citizen/support}" class="text-sm text-slate-600 flex items-center gap-2"><span class="material-symbols-outlined text-lg">arrow_back</span>My requests</a>
    <div class="ml-auto flex gap-2">
      <a th:href="@{/citizen/support/contact-us}" class="rounded-lg border px-3 py-2 text-xs font-bold"
         th:classappend="${supportForm.requestType == 'CONTACT' ? ' border-sky-600 bg-sky-50 text-sky-700' : ' border-slate-300'}">Contact Us</a>
      <a th:href="@{/citizen/support/complaint}" class="rounded-lg border px-3 py-2 text-xs font-bold"
         th:classappend="${supportForm.requestType == 'COMPLAINT' ? ' border-orange-500 bg-orange-50 text-orange-700' : ' border-slate-300'}">Complaint</a>
    </div>
  </div>
</header>

<main class="max-w-4xl mx-auto p-4 sm:p-6">
  <div class="mb-5">
    <h1 class="text-2xl font-extrabold" th:text="${formTitle}">Contact Us</h1>
    <p class="text-sm text-slate-500 mt-1" th:text="${formDescription}">Send a message to CSR.</p>
  </div>

  <form th:action="@{/citizen/support}" th:object="${supportForm}" method="post"
        class="bg-white rounded-2xl border border-slate-200 shadow-sm p-5 sm:p-7">
    <input type="hidden" th:field="*{requestType}"/>

    <div th:if="${#fields.hasGlobalErrors()}" class="mb-5 rounded-xl border border-red-200 bg-red-50 p-4 text-sm text-red-700">
      <p th:each="error : ${#fields.globalErrors()}" th:text="${error}">Unable to submit request.</p>
    </div>

    <div class="rounded-xl p-4 mb-5 flex gap-3"
         th:classappend="${supportForm.requestType == 'COMPLAINT' ? ' bg-orange-50 border border-orange-200' : ' bg-sky-50 border border-sky-200'}">
      <span class="material-symbols-outlined" th:text="${supportForm.requestType == 'COMPLAINT' ? 'report' : 'support_agent'}">support_agent</span>
      <div><p class="font-bold text-sm" th:text="${supportForm.requestType == 'COMPLAINT' ? 'Complaint form' : 'Contact Us form'}">Form</p>
        <p class="text-xs text-slate-600 mt-1">Your account details are added automatically from your login session.</p></div>
    </div>

    <label class="block text-sm font-bold text-slate-700">Subject
      <input th:field="*{subject}" maxlength="200" required
             class="mt-2 w-full rounded-xl border-slate-300 text-sm" placeholder="Briefly describe what you need help with"/>
    </label>
    <p th:if="${#fields.hasErrors('subject')}" th:errors="*{subject}" class="text-xs text-red-600 mt-1">Subject error</p>

    <label class="block text-sm font-bold text-slate-700 mt-5">Message
      <textarea id="supportMessage" th:field="*{message}" maxlength="2000" rows="8" required
                class="mt-2 w-full rounded-xl border-slate-300 text-sm resize-y"
                placeholder="Provide the information the CSR officer needs"></textarea>
    </label>
    <div class="flex justify-between mt-1 text-xs">
      <p th:if="${#fields.hasErrors('message')}" th:errors="*{message}" class="text-red-600">Message error</p>
      <p class="ml-auto text-slate-400"><span id="characterCount">0</span>/2000</p>
    </div>

    <div class="mt-6 flex flex-col-reverse sm:flex-row sm:justify-end gap-3">
      <a th:href="@{/citizen/support}" class="rounded-xl border border-slate-300 px-5 py-3 text-sm font-bold text-center">Cancel</a>
      <button class="rounded-xl px-6 py-3 text-sm font-bold text-white"
              th:classappend="${supportForm.requestType == 'COMPLAINT' ? ' bg-orange-500 hover:bg-orange-600' : ' bg-sky-600 hover:bg-sky-700'}">
        Submit to Citizen Service
      </button>
    </div>
  </form>
</main>
<script>
const supportMessage = document.getElementById('supportMessage');
const characterCount = document.getElementById('characterCount');
function updateCount(){characterCount.textContent = supportMessage.value.length}
supportMessage.addEventListener('input', updateCount); updateCount();
</script>
<script src="/js/portal-shell.js?v=20260915-signout"></script>
</body>
</html>
