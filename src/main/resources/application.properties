spring.application.name=identity-issuance-service
server.port= 8080

spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=identity_issuance_service;integratedSecurity=true;encrypt=true;trustServerCertificate=true;

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.show-sql=true

# Uploaded files are kept on disk; only this relative path is saved in ApplicationDocument.
app.upload.directory=uploads

# Let the service receive the file and show its own clear 5 MB validation message.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB


