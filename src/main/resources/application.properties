spring.application.name=identity-issuance-service
server.port= 8080

spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=identity_issuance_service;integratedSecurity=true;encrypt=true;trustServerCertificate=true;sendTimeAsDatetime=false;

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.show-sql=true

# Uploaded files are kept on disk; only this relative path is saved in ApplicationDocument.
app.upload.directory=uploads

# Let the service receive the file and show its own clear 5 MB validation message.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB


spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${LANKAID_MAIL_USERNAME:}
spring.mail.password=${LANKAID_MAIL_APP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.from=${LANKAID_MAIL_FROM:${LANKAID_MAIL_USERNAME:}}
app.registration.email-code-minutes=10
app.registration.email-resend-seconds=60

# Full SMS POST endpoint, including your phone's current IP, port and API path.
# Set these environment variables in your terminal or IDE, then restart the app.
app.sms.url=http://192.168.1.7:8080/sms
app.sms.api-key=${LANKAID_SMS_API_KEY:}
app.sms.connect-timeout-seconds=5
app.sms.read-timeout-seconds=10

# The same TTL is used for OTP expiry and the SMS API's ttlSeconds field.
app.otp.ttl-seconds=180
app.otp.max-attempts=5
app.otp.resend-seconds=60
app.otp.verification-seconds=900
